spring.application.name=blanket-backend
server.address=127.0.0.1
server.port=8080

blanket.mqtt.enabled=${BLANKET_MQTT_ENABLED:true}
blanket.mqtt.url=${BLANKET_MQTT_URL:tcp://127.0.0.1:1883}
blanket.mqtt.observer-client-id=${BLANKET_MQTT_OBSERVER_CLIENT_ID:blanket-spring-observer}
blanket.mqtt.observer-username=${BLANKET_MQTT_OBSERVER_USERNAME:blanket-device}
blanket.mqtt.observer-password=${BLANKET_MQTT_OBSERVER_PASSWORD:}
blanket.mqtt.publisher-client-id=${BLANKET_MQTT_PUBLISHER_CLIENT_ID:blanket-spring-publisher}
blanket.mqtt.publisher-username=${BLANKET_MQTT_PUBLISHER_USERNAME:blanket-publisher}
blanket.mqtt.publisher-password=${BLANKET_MQTT_PUBLISHER_PASSWORD:}
blanket.mqtt.data-topic=${BLANKET_MQTT_DATA_TOPIC:medical-blanket/v1/+/+/+/sensor/+/data}
blanket.mqtt.alarm-topic=${BLANKET_MQTT_ALARM_TOPIC:medical-blanket/v1/H001/+/+/alarm}
