# Insert inside the HTTPS/HTTP server block that serves the SPA.
location ~ ^/api/public/sensors/([A-Za-z0-9_-]+)$ {
    alias /var/www/blanket-sensor-data/$1.json;
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-store" always;
}

location = /api/public/sensors/ {
    alias /var/www/blanket-sensor-data/index.json;
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-store" always;
}

location = /api/public/time {
    alias /var/www/blanket-system/time.json;
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-store" always;
}
