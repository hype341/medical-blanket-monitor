server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/blanket;
    index index.html;
    server_name _;

    include /etc/nginx/snippets/blanket-sensor-data.conf;

    location /prod-api/api/v1/realtime/ws {
        proxy_pass https://www.youlai.tech/api/v1/realtime/ws;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name www.youlai.tech;
        proxy_set_header Host www.youlai.tech;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /prod-api/ {
        proxy_pass https://www.youlai.tech/;
        proxy_ssl_server_name on;
        proxy_ssl_name www.youlai.tech;
        proxy_set_header Host www.youlai.tech;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /mqtt {
        proxy_pass http://127.0.0.1:8083/mqtt;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location = /version.json {
        add_header Cache-Control "no-store";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
